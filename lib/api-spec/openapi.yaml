openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /status:
    get:
      operationId: getStoryStatus
      responses:
        "200":
          description: Story generation mode
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoryStatus"
  /story:
    post:
      operationId: generateStory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StoryInput"
      responses:
        "200":
          description: Complete story
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Story"
        default:
          description: Friendly error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoryError"
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
components:
  schemas:
    StoryStatus:
      type: object
      required: [demo]
      properties:
        demo: { type: boolean }
    StoryInput:
      type: object
      additionalProperties: false
      required: [objectIds, mood]
      properties:
        objectIds:
          type: array
          minItems: 3
          maxItems: 10
          uniqueItems: true
          items: { type: string }
        mood: { type: string, enum: [calm, funny, mystery] }
        recentOpenings:
          type: array
          maxItems: 2
          items: { type: string, maxLength: 160 }
    Story:
      type: object
      required: [id, objectIds, mood, language, title, story, wordCount, source]
      properties:
        id: { type: string }
        objectIds:
          type: array
          items: { type: string }
        mood: { type: string, enum: [calm, funny, mystery] }
        language: { type: string, enum: [en] }
        title: { type: string }
        story: { type: string }
        wordCount: { type: integer, minimum: 200, maximum: 300 }
        source: { type: string, enum: [ai, demo] }
    StoryError:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

